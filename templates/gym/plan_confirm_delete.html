{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-black/40 backdrop-blur-2xl rounded-3xl p-8 border border-red-500/30 text-center shadow-[0_0_50px_rgba(239,68,68,0.15)] relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 to-red-400"></div>
        
        <div class="w-20 h-20 mx-auto bg-red-500/10 rounded-full flex items-center justify-center mb-6 border border-red-500/20">
            <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>

        <h1 class="text-2xl font-bold text-white mb-4">¿Eliminar Plan?</h1>
        <p class="text-brand-muted mb-8">
            Estás a punto de eliminar el plan <strong class="text-white">{{ plan.nombre }}</strong>. Esta acción no se puede deshacer.
        </p>

        <form method="POST" class="flex space-x-4">
            {% csrf_token %}
            <a href="{% url 'plan_list' %}" class="flex-1 py-3 px-4 bg-white/5 hover:bg-white/10 text-white font-medium rounded-xl transition-colors border border-white/10 text-center">
                Cancelar
            </a>
            <button type="submit" class="flex-1 py-3 px-4 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl transition-all shadow-[0_0_15px_rgba(239,68,68,0.4)]">
                Sí, Eliminar
            </button>
        </form>
    </div>
</div>
{% endblock %}
