{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-black/40 backdrop-blur-2xl rounded-3xl p-8 border border-red-500/30 text-center shadow-[0_0_50px_rgba(239,68,68,0.15)] relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 to-red-400"></div>
        
        <div class="w-20 h-20 mx-auto bg-red-500/10 rounded-full flex items-center justify-center mb-6 border border-red-500/20">
            <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </div>

        <h1 class="text-2xl font-bold text-white mb-4">¿Eliminar Miembro del Staff?</h1>
        <p class="text-brand-muted mb-8">
            Estás a punto de eliminar a <strong class="text-white">{{ miembro.nombre_completo }}</strong> del directorio. Esta acción no se puede deshacer.
        </p>

        <form method="POST" class="flex space-x-4">
            {% csrf_token %}
            <a href="{% url 'personal_list' %}" class="flex-1 py-3 px-4 bg-white/5 hover:bg-white/10 text-white font-medium rounded-xl transition-colors border border-white/10 text-center">
                Cancelar
            </a>
            <button type="submit" class="flex-1 py-3 px-4 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl transition-all shadow-[0_0_15px_rgba(239,68,68,0.4)]">
                Sí, Eliminar
            </button>
        </form>
    </div>
</div>
{% endblock %}
