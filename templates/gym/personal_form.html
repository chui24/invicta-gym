{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8 flex items-center">
        <a href="{% url 'personal_list' %}" class="text-brand-muted hover:text-white mr-4 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <h1 class="text-3xl font-bold text-white">{{ titulo }}</h1>
    </div>

    <div class="bg-black/30 backdrop-blur-2xl rounded-2xl p-8 border border-white/10 shadow-[0_0_40px_rgba(0,0,0,0.5)]">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-brand-muted text-sm font-medium mb-2">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-red-400 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <div class="pt-4 border-t border-white/10">
                <button type="submit" class="w-full bg-brand-accent hover:bg-brand-accent/80 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-[0_0_15px_rgba(213,0,249,0.4)] hover:shadow-[0_0_25px_rgba(213,0,249,0.6)]">
                    Guardar Personal
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
