<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Invicta Gym{% endblock %}</title>
    <!-- Tailwind CSS Output -->
    <link rel="stylesheet" href="{% static 'css/tailwind_output.css' %}">
    <!-- Bootstrap Icons (se mantiene solo para la tipografía de íconos) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-brand-bg text-brand-text font-sans overflow-x-hidden">
    <div class="flex w-full min-h-screen">
        <!-- Sidebar -->
        <nav class="sidebar w-[250px] bg-brand-sidebar text-white min-h-screen flex flex-col transition-all duration-300 border-r border-brand-accent/40 shadow-[2px_0_10px_rgba(213,0,249,0.1)]">
            <div class="p-4 flex justify-center items-center border-b border-white/5">
                <img src="{% static 'img/invicta_logo.png' %}" alt="Invicta Team Vero" class="max-w-[140px] h-auto drop-shadow-[0_0_8px_rgba(213,0,249,0.6)]">
            </div>
            <ul class="flex flex-col mt-3 w-full pl-0">
                <li class="w-full">
                    <a class="flex items-center px-5 py-4 text-[#d1d1d1] transition-all duration-300 hover:text-white hover:bg-brand-accent/10 hover:border-l-4 hover:border-brand-accent hover:shadow-[0_0_5px_rgba(213,0,249,0.5)] {% if request.resolver_match.url_name == 'dashboard' %}text-white bg-brand-accent/10 border-l-4 border-brand-accent shadow-[0_0_5px_rgba(213,0,249,0.5)]{% else %}border-l-4 border-transparent{% endif %}" href="{% url 'dashboard' %}">
                        <i class="bi bi-grid-1x2-fill mr-3"></i> Dashboard
                    </a>
                </li>
                <li class="w-full">
                    <a class="flex items-center px-5 py-4 text-[#d1d1d1] transition-all duration-300 hover:text-white hover:bg-brand-accent/10 hover:border-l-4 hover:border-brand-accent hover:shadow-[0_0_5px_rgba(213,0,249,0.5)] {% if 'cliente' in request.resolver_match.url_name %}text-white bg-brand-accent/10 border-l-4 border-brand-accent shadow-[0_0_5px_rgba(213,0,249,0.5)]{% else %}border-l-4 border-transparent{% endif %}" href="{% url 'cliente_list' %}">
                        <i class="bi bi-people-fill mr-3"></i> Clientes
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="main-content flex-grow p-8 overflow-y-auto transition-all duration-300" id="mainContent">
            <div class="flex items-center justify-between mb-8 w-full">
                <button id="sidebarToggle" class="bg-transparent border-none text-brand-accent text-3xl cursor-pointer mr-4 drop-shadow-[0_0_10px_rgba(213,0,249,0.6)]">
                    <i class="bi bi-list"></i>
                </button>
                <div class="text-right uppercase leading-tight">
                    <div class="text-white font-bold text-base tracking-[2px]">NO SEAS GUAPA,</div>
                    <div class="font-black text-[1.6rem] tracking-[3px] text-white" style="text-shadow: 0 0 12px rgba(213, 0, 249, 0.8), 0 0 20px rgba(213, 0, 249, 0.4);">SÉ ICÓNICA</div>
                </div>
            </div>
            
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Scripts -->
    <script src="{% static 'js/base.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
