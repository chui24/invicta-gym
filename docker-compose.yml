version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-invicta_gym}
      POSTGRES_USER: ${DB_USER:-ubuntu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      instances:
        ipv4_address: 172.20.0.11

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes: []
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-invicta_gym}
      - DB_USER=${DB_USER:-ubuntu}
      - DB_PASSWORD=${DB_PASSWORD:-mysecretpassword}
      - DB_PORT=${DB_PORT:-5432}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
    depends_on:
      - db
      - tailwind
    networks:
      instances:
        ipv4_address: 172.20.0.10

  tailwind:
    image: node:20-alpine
    working_dir: /app
    volumes: []
    command: sh -c "npm install && npm run tailwind:watch"
    networks:
      instances:
        ipv4_address: 172.20.0.12

volumes:
  postgres_data:

networks:
  instances:
    name: instances
    external: true
