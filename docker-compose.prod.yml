version: '3.8'

services:
  db:
    networks:
      instances:
        ipv4_address: 172.20.0.11

  web:
    # Eliminar el mapeo de volumen para que use el código inyectado en la imagen
    volumes: []
    networks:
      instances:
        ipv4_address: 172.20.0.10

  tailwind:
    volumes: []
    networks:
      instances:
        ipv4_address: 172.20.0.12

networks:
  instances:
    name: instances
    external: true
